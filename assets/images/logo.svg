<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0288D1"/>
      <stop offset="50%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="bubbleGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#80D8FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0091EA" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0D47A1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon Section -->
  <g transform="translate(6, 6)">
    <!-- Washing Machine Badge -->
    <rect x="0" y="0" width="68" height="68" rx="18" fill="url(#logoBgGrad)" filter="url(#logoShadow)"/>
    <!-- Drum circle -->
    <circle cx="34" cy="34" r="24" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Water swirl -->
    <path d="M 15 35 C 21 29, 28 39, 34 35 C 40 31, 47 40, 53 35 C 53 45, 44 53, 34 53 C 24 53, 15 45, 15 35 Z" fill="#29B6F6" fill-opacity="0.55"/>
    <!-- Shirt -->
    <g transform="translate(34, 30) scale(0.55)">
      <path d="M -18 -16 L -7 -22 L 7 -22 L 18 -16 L 24 -2 L 15 2 L 13 -6 L 13 22 L -13 22 L -13 -6 L -15 2 L -24 -2 Z" fill="#FFFFFF"/>
      <path d="M -7 -22 L 0 -11 L 7 -22" fill="none" stroke="#1565C0" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="2" r="1.5" fill="#1565C0"/>
      <circle cx="0" cy="11" r="1.5" fill="#1565C0"/>
    </g>
    <!-- Bubbles -->
    <circle cx="18" cy="18" r="4.5" fill="url(#bubbleGradFull)" stroke="#FFFFFF" stroke-width="0.8"/>
    <circle cx="51" cy="17" r="5.5" fill="url(#bubbleGradFull)" stroke="#FFFFFF" stroke-width="0.9"/>
    <!-- Sparkle -->
    <path d="M 48 9 Q 48 13 52 13 Q 48 13 48 17 Q 48 13 44 13 Q 48 13 48 9" fill="#FFF"/>
  </g>

  <!-- Typography Section -->
  <g transform="translate(86, 0)">
    <text x="0" y="38" font-family="'Poppins', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="900" fill="url(#textGrad)" letter-spacing="0.5">NAGASA</text>
    <text x="122" y="38" font-family="'Poppins', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="400" fill="#0288D1" letter-spacing="1">LAUNDRY</text>
    <text x="2" y="56" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="1.5">BERSIH • RAPI • WANGI • PALU</text>
    <rect x="2" y="62" width="220" height="2" rx="1" fill="#E2E8F0"/>
    <rect x="2" y="62" width="60" height="2" rx="1" fill="#0288D1"/>
  </g>
</svg>
