<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0288D1"/>
      <stop offset="50%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#80D8FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0091EA" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#40C4FF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0D47A1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Rounded Container / Washing Machine Silhouette -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#bgGrad)" filter="url(#softGlow)"/>

  <!-- Machine Outer Rim (Metallic Blue-White Ring) -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.9"/>
  <circle cx="50" cy="50" r="30" fill="#0D47A1" fill-opacity="0.4" stroke="#80D8FF" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Water Wave Swirl in Drum -->
  <path d="M 22 52 C 30 44, 40 58, 50 50 C 60 42, 70 56, 78 50 C 78 64, 66 76, 50 76 C 34 76, 22 64, 22 52 Z" fill="#29B6F6" fill-opacity="0.45"/>
  <path d="M 26 56 C 34 50, 42 62, 50 56 C 58 50, 66 60, 74 54 C 72 66, 62 74, 50 74 C 38 74, 28 66, 26 56 Z" fill="#00E5FF" fill-opacity="0.6"/>

  <!-- Clean Shirt Icon (Folded / Fresh) -->
  <g transform="translate(50, 44) scale(0.72)">
    <!-- Shirt Collar & Body -->
    <path d="M -18 -16 L -7 -22 L 7 -22 L 18 -16 L 24 -2 L 15 2 L 13 -6 L 13 22 L -13 22 L -13 -6 L -15 2 L -24 -2 Z" 
          fill="#FFFFFF" filter="url(#softGlow)"/>
    <!-- Collar Line -->
    <path d="M -7 -22 L 0 -11 L 7 -22" fill="none" stroke="#1565C0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tie / Placket Buttons -->
    <circle cx="0" cy="-3" r="1.5" fill="#1565C0"/>
    <circle cx="0" cy="5" r="1.5" fill="#1565C0"/>
    <circle cx="0" cy="13" r="1.5" fill="#1565C0"/>
  </g>

  <!-- Water Bubbles -->
  <!-- Bubble 1 (Top Left) -->
  <circle cx="28" cy="28" r="6" fill="url(#bubbleGrad)" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.8"/>
  <ellipse cx="26" cy="26" rx="2" ry="1.2" fill="#FFFFFF" opacity="0.8" transform="rotate(-30 26 26)"/>

  <!-- Bubble 2 (Top Right) -->
  <circle cx="72" cy="26" r="8" fill="url(#bubbleGrad)" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.9"/>
  <ellipse cx="69.5" cy="23.5" rx="2.5" ry="1.5" fill="#FFFFFF" opacity="0.9" transform="rotate(-30 69.5 23.5)"/>

  <!-- Bubble 3 (Small Bottom Right) -->
  <circle cx="74" cy="42" r="4" fill="url(#bubbleGrad)" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.7"/>

  <!-- Bubble 4 (Small Bottom Left) -->
  <circle cx="22" cy="42" r="3.5" fill="url(#bubbleGrad)" stroke="#FFFFFF" stroke-width="0.7" stroke-opacity="0.7"/>

  <!-- Sparkles (Fresh & Clean Glint) -->
  <g transform="translate(68, 16) scale(0.6)">
    <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8" fill="#FFF" opacity="0.95"/>
  </g>
  <g transform="translate(24, 70) scale(0.5)">
    <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8" fill="#FFF" opacity="0.85"/>
  </g>
</svg>
